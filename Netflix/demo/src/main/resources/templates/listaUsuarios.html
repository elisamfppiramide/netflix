<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Lista usuarios</title>
</head>
<body>
    <table border="1">
        <tr>
            <th>NOMBRE DE USUARIO</th>
        </tr>
        <tr th:each="usuario : ${usuarios}">
            <td th:text="${usuario.nombreUsuario}"></td>
        </tr>
    </table>
</body>
</html>
